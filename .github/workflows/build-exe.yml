name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Temporarily disabled while feature work is in progress.
    # Re-enable by removing this guard and restoring the release tag push trigger if needed.
    if: ${{ false }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build release package
        shell: powershell
        run: .\build_exe.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: email-builder-windows
          path: dist/Email Builder.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Email Builder.zip
